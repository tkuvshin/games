<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Конструктор планов эвакуации</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app-container">
    <header>
      <h1>Конструктор планов эвакуации</h1>
      <p>Сетка = 1 метр (условно). Толщина стен фиксирована (4 мм).</p>
    </header>

    <div class="main-area">
      <!-- Палитра -->
      <aside class="palette">
        <h3>Стены</h3>
        <div class="wall-tools">
          <div class="tool wall-h" data-type="wall-h">Стена (Гор.)</div>
          <div class="tool wall-v" data-type="wall-v">Стена (Верт.)</div>
        </div>
        
        <h3>Знаки</h3>
        <div class="sign-tools">
          <div class="tool sign-exit" data-type="sign" data-sign="exit">🚪 Выход</div>
          <div class="tool sign-ext" data-type="sign" data-sign="extinguisher">
          <img src="extinguisher.svg" width="24" height="24" style="vertical-align: middle;"> Огнетушитель</div>
        </div>
      </aside>

      <!-- Рабочая область -->
      <main class="workspace">
        <svg id="canvas" width="100%" height="600">
          <!-- Сетка как паттерн на фоне (не мешает кликам) -->
          <defs>
            <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
              <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e0e0e0" stroke-width="1"/>
            </pattern>
          </defs>
          <!-- Фон с сеткой -->
          <rect id="bg-grid" width="100%" height="100%" fill="url(#grid)" />
          
          <!-- Слой для контента -->
          <g id="content-layer"></g>
        </svg>
      </main>
    </div>
    
    <div class="status-bar">
      <button id="clearBtn" style="background: #e53935; color: white; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer;">Очистить холст</button>
      <span>Сетка: 1 клетка = 1 метр</span>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
