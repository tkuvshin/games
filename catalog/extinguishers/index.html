<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расставь огнетушители</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <a href="../../index.html" class="back-btn">← Назад в каталог</a>
      <h1>Расставь огнетушители</h1>
      <p>Перетащите огнетушители на план так, чтобы они были доступны и находились на правильной высоте.</p>
    </header>

    <div class="game-area">
      <div class="room" id="room">
        <div class="door">Вход</div>
        <div class="window">Окно</div>
      </div>
      
      <div class="inventory" id="inventory">
        <h2>Склад (перетащите на план):</h2>
        <div class="items">
          <div class="extinguisher" draggable="true" data-type="light" data-weight="4">
            <span>🧯</span> ОП-4 (4 кг)
          </div>
          <div class="extinguisher" draggable="true" data-type="heavy" data-weight="9">
            <span>🧯</span> ОП-9 (9 кг)
          </div>
        </div>
      </div>
    </div>

    <div class="status-panel" id="status">Перетащите огнетушитель в комнату</div>
  </div>
  <script src="script.js"></script>
</body>
</html>
